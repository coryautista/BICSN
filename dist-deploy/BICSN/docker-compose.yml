services:
  bicsn-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      # En Debian/Ubuntu suele existir libfbclient.so.2 sin symlink .so
      FIREBIRD_CLIENT_LIB: /usr/lib/x86_64-linux-gnu/libfbclient.so.2
    env_file:
      - .env
    volumes:
      - bicsn_logs:/app/logs
      - bicsn_archivosTmp:/app/archivosTmp
      - bicsn_temp:/app/temp
    restart: unless-stopped
    networks:
      - bicsn-network

networks:
  bicsn-network:
    driver: bridge

volumes:
  bicsn_logs:
  bicsn_archivosTmp:
  bicsn_temp:

